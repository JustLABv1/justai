services:
  justai-postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: justai
      POSTGRES_USER: justai
      POSTGRES_PASSWORD: justai
    ports:
      - "54329:5432"
    volumes:
      - justai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justai -d justai"]
      interval: 5s
      timeout: 5s
      retries: 12

  justai-backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    environment:
      JUSTAI_ENV: development
      JUSTAI_PORT: 8080
      JUSTAI_DATABASE_URL: postgres://justai:justai@justai-postgres:5432/justai?sslmode=disable
      JUSTAI_JWT_SECRET: justai-local-development-secret-change-me
      JUSTAI_ENCRYPTION_KEY: justai-local-encryption-key-change-me
      JUSTAI_FRONTEND_ORIGINS: http://localhost:3000
      JUSTAI_DEV_SEED: "true"
      JUSTAI_SECURE_COOKIES: "false"
      JUSTAI_OIDC_REDIRECT_URL: http://localhost:8080/api/v1/auth/oidc/callback
      JUSTAI_MCP_OAUTH_REDIRECT_URL: http://localhost:8080/api/v1/mcp/oauth/callback
      JUSTAI_ALLOW_PRIVATE_TARGETS: "false"
    ports:
      - "8080:8080"
    depends_on:
      justai-postgres:
        condition: service_healthy
    volumes:
      - ./services/backend/config.example.yaml:/etc/justai/config.yaml:ro
      - justai-backend-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  justai-frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      justai-backend:
        condition: service_healthy

volumes:
  justai-postgres-data:
  justai-backend-data:
