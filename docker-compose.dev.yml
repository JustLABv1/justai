services:
  justai-postgres:
    image: pgvector/pgvector:pg17
    container_name: justai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: justai
      POSTGRES_USER: justai
      POSTGRES_PASSWORD: justai
    ports:
      - "54329:5432"
    volumes:
      - justai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justai -d justai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  justai-postgres-data:
