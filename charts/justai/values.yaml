## JustAI Helm chart defaults.
## Workload `env` and `envFrom` values use the native Kubernetes EnvVar and
## EnvFromSource shapes. Keep credentials in an external Secret or Vault; the
## inline values below are intended only for private, non-production values
## files.

# microservices uses the backend and frontend images separately. monolith uses
# the combined root Dockerfile image.
deploymentMode: microservices
replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
# Defaults comply with Kubernetes Pod Security Standards "restricted". These
# can be extended or overridden for a platform with additional requirements.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true

config:
  environment: production
  port: 8080
  # Empty derives the first ingress host and scheme. Set explicitly when the
  # frontend is exposed by another hostname.
  frontendOrigins: []
  oidc:
    issuer: ""
    clientId: ""
    # The callback defaults to the first ingress host plus the backend path.
    redirectUrl: ""
  mcpOAuthRedirectUrl: ""
  allowPrivateTargets: false
  devSeed: false
  secureCookies: true
  cookieSameSite: lax
  cookieDomain: ""
  transcription:
    storageDriver: local
    localStoragePath: /app/data/transcription
    # The browser-facing endpoint must be reachable by clients for presigned
    # multipart uploads. Use s3ProcessingEndpoint for a worker-only address
    # when the backend/worker network differs from the browser network.
    s3Endpoint: ""
    s3ProcessingEndpoint: ""
    s3Region: us-east-1
    s3Bucket: ""
    streamingChunkMs: 2500
    streamingOverlapMs: 500
    streamingPromptChars: 160
    audioRetentionDays: 30
    diarizationWindowSeconds: 30
    diarizationOverlapSeconds: 5
    maxSessionHours: 8
    videoUploadMaxBytes: 5368709120
    videoUploadPartBytes: 16777216
    videoMaxDurationHours: 4

monolith:
  image:
    repository: ghcr.io/justlabv1/justai
    pullPolicy: IfNotPresent
    # Empty follows Chart.appVersion (latest for local chart, release version
    # when the chart is packaged by the release workflow).
    tag: ""
  service:
    type: ClusterIP
    port: 80
    backendPort: 8080
    frontendPort: 3000
  env: []
  envFrom: []
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/justlabv1/justai
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  env: []
  envFrom: []
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/justlabv1/justai
    pullPolicy: IfNotPresent
    tag: ""
  # Published frontend images default to same-origin /api/v1 requests. If you
  # build a frontend for a separately exposed backend, pass
  # NEXT_PUBLIC_API_URL to services/frontend/Dockerfile at build time.
  service:
    type: ClusterIP
    port: 3000
  env: []
  envFrom: []
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Speaker diarization is an optional, heavyweight service. It downloads a
# gated Hugging Face model on first start and should only be enabled for
# installations that have accepted the pyannote model terms.
pyannote:
  enabled: false
  image:
    repository: ghcr.io/justlabv1/justai
    pullPolicy: IfNotPresent
    # Release workflows publish pyannote images with this tag convention.
    tag: ""
  service:
    type: ClusterIP
    port: 8000
  modelId: pyannote/speaker-diarization-3.1
  device: auto
  minAudioSeconds: 1
  torchThreads: 2
  downloadTimeoutSeconds: 1800
  maxSourceBytes: "21474836480"
  # Hugging Face and Pyannote use the standard HTTP(S)_PROXY environment
  # variables. Set these when model downloads must go through an egress proxy.
  # Keep credentials out of the URL when possible; use secrets.refs below for
  # proxy URLs that contain credentials.
  proxy:
    http: ""
    https: ""
    noProxy: []
  env: []
  envFrom: []
  cache:
    persistence:
      enabled: false
      storageClassName: ""
      size: 20Gi
  podAnnotations: {}
  # Minimus Python runs as UID/GID 1000. fsGroup makes an optional persistent
  # Hugging Face cache writable without weakening the non-root runtime.
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    limits:
      cpu: 2
      memory: 8Gi
    requests:
      cpu: 500m
      memory: 2Gi
  startupProbe:
    failureThreshold: 60
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: justai.example.com
      paths:
        - path: /api/v1
          pathType: Prefix
          backend: true
        - path: /health
          pathType: Prefix
          backend: true
        - path: /
          pathType: Prefix
  tls: []

uploads:
  persistence:
    enabled: false
    storageClassName: ""
    size: 10Gi

postgresql:
  enabled: false
  image: pgvector/pgvector:pg17
  pullPolicy: IfNotPresent
  mountPath: /var/lib/postgresql/data
  persistence:
    enabled: true
    storageClassName: ""
    size: 20Gi
  auth:
    database: justai
    username: justai
  service:
    type: ClusterIP
    port: 5432
  env: []
  envFrom: []
  # PostgreSQL runs as UID 999 in the pgvector image. fsGroup lets the
  # container initialize a fresh PVC without a privileged init container.
  podSecurityContext:
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

secrets:
  create: false
  existingSecret: ""
  # These values are used only when create=true (or by a private values file).
  # Prefer an external Secret or Vault in production.
  data:
    databaseURL: ""
    postgresqlPassword: ""
    jwtSecret: ""
    encryptionKey: ""
    pyannoteHfToken: ""
    pyannoteServiceToken: ""
    pyannoteHttpProxy: ""
    pyannoteHttpsProxy: ""
    pyannoteNoProxy: ""
    s3AccessKey: ""
    s3SecretKey: ""
  vault:
    enabled: false
    authRef: ""
    type: kv-v2
    mount: secrets
    namespace: ""
    path: ""
    refreshAfter: 30s
    destination:
      create: true
  # Every secret-backed environment variable uses this name/key shape. Leave
  # name empty to inherit existingSecret (or the generated/Vault Secret).
  refs:
    databaseURL:
      name: ""
      key: database-url
    postgresqlPassword:
      name: ""
      key: postgresql-password
    jwtSecret:
      name: ""
      key: jwt-secret
    encryptionKey:
      name: ""
      key: encryption-key
    pyannoteHfToken:
      name: ""
      key: hf-token
    pyannoteServiceToken:
      name: ""
      key: service-token
    pyannoteHttpProxy:
      name: ""
      key: http-proxy
    pyannoteHttpsProxy:
      name: ""
      key: https-proxy
    pyannoteNoProxy:
      name: ""
      key: no-proxy
    s3AccessKey:
      name: ""
      key: s3-access-key
    s3SecretKey:
      name: ""
      key: s3-secret-key

customCA:
  enabled: false
  name: ""
  secret: true
  mountPath: /etc/ssl/certs/extra-ca.crt

nodeSelector: {}
tolerations: []
affinity: {}
