{{- if eq .Values.deploymentMode "monolith" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "justai.fullname" . }}
  labels:
    {{- include "justai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.monolith.service.type }}
  ports:
    - name: frontend
      port: {{ .Values.monolith.service.port }}
      targetPort: frontend
      protocol: TCP
    - name: backend
      port: {{ .Values.monolith.service.backendPort }}
      targetPort: backend
      protocol: TCP
  selector:
    {{- include "justai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: monolith
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "justai.fullname" . }}-backend
  labels:
    {{- include "justai.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: backend
      port: {{ .Values.backend.service.port }}
      targetPort: backend
      protocol: TCP
  selector:
    {{- include "justai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "justai.fullname" . }}-frontend
  labels:
    {{- include "justai.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "justai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
