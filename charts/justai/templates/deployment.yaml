{{- include "justai.validateSecretRefs" . -}}
{{- $root := . -}}
{{- $databaseURLName := include "justai.secretRefName" (dict "root" . "ref" "databaseURL") -}}
{{- $databaseURLKey := include "justai.secretRefKey" (dict "root" . "ref" "databaseURL") -}}
{{- $jwtSecretName := include "justai.secretRefName" (dict "root" . "ref" "jwtSecret") -}}
{{- $jwtSecretKey := include "justai.secretRefKey" (dict "root" . "ref" "jwtSecret") -}}
{{- $encryptionKeyName := include "justai.secretRefName" (dict "root" . "ref" "encryptionKey") -}}
{{- $encryptionKeyKey := include "justai.secretRefKey" (dict "root" . "ref" "encryptionKey") -}}
{{- $configName := printf "%s-backend-config" (include "justai.fullname" .) -}}
{{- $uploadsName := printf "%s-uploads" (include "justai.fullname" .) -}}
{{- if eq .Values.deploymentMode "monolith" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "justai.fullname" . }}
  labels:
    {{- include "justai.labels" . | nindent 4 }}
    app.kubernetes.io/component: monolith
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "justai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: monolith
  template:
    metadata:
      labels:
        {{- include "justai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: monolith
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "justai.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: justai
          image: "{{ .Values.monolith.image.repository }}:{{ .Values.monolith.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.monolith.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: frontend
              containerPort: {{ .Values.monolith.service.frontendPort }}
              protocol: TCP
            - name: backend
              containerPort: {{ .Values.monolith.service.backendPort }}
              protocol: TCP
          env:
            - name: JUSTAI_ENV
              value: {{ .Values.config.environment | quote }}
            - name: JUSTAI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $databaseURLName | quote }}
                  key: {{ $databaseURLKey | quote }}
            - name: JUSTAI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecretName | quote }}
                  key: {{ $jwtSecretKey | quote }}
            - name: JUSTAI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $encryptionKeyName | quote }}
                  key: {{ $encryptionKeyKey | quote }}
            {{- with .Values.monolith.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.monolith.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: backend-config
              mountPath: /etc/justai/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: uploads
              mountPath: /app/data
            {{- if .Values.customCA.enabled }}
            - name: custom-ca
              mountPath: {{ .Values.customCA.mountPath }}
              subPath: ca.crt
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: backend
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: backend
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.monolith.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: backend-config
          configMap:
            name: {{ $configName }}
        - name: uploads
          {{- if .Values.uploads.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $uploadsName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.customCA.enabled }}
        - name: custom-ca
          {{- if .Values.customCA.secret }}
          secret:
            secretName: {{ .Values.customCA.name }}
          {{- else }}
          configMap:
            name: {{ .Values.customCA.name }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
