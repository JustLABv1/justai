{{- include "justai.validateSecretRefs" . -}}
{{- $root := . -}}
{{- $databaseURLName := include "justai.secretRefName" (dict "root" . "ref" "databaseURL") -}}
{{- $databaseURLKey := include "justai.secretRefKey" (dict "root" . "ref" "databaseURL") -}}
{{- $jwtSecretName := include "justai.secretRefName" (dict "root" . "ref" "jwtSecret") -}}
{{- $jwtSecretKey := include "justai.secretRefKey" (dict "root" . "ref" "jwtSecret") -}}
{{- $encryptionKeyName := include "justai.secretRefName" (dict "root" . "ref" "encryptionKey") -}}
{{- $encryptionKeyKey := include "justai.secretRefKey" (dict "root" . "ref" "encryptionKey") -}}
{{- $s3Enabled := eq (lower .Values.config.transcription.storageDriver) "s3" -}}
{{- $s3AccessKeyValue := .Values.secrets.data.s3AccessKey | default "" -}}
{{- $s3SecretKeyValue := .Values.secrets.data.s3SecretKey | default "" -}}
{{- $s3AccessKeyRefName := .Values.secrets.refs.s3AccessKey.name | default "" -}}
{{- $s3SecretKeyRefName := .Values.secrets.refs.s3SecretKey.name | default "" -}}
{{- $externalSecretStore := or .Values.secrets.existingSecret .Values.secrets.vault.enabled -}}
{{- if $s3Enabled }}
{{- if and (not $s3AccessKeyValue) (not $s3AccessKeyRefName) (not $externalSecretStore) }}
{{- fail "S3 storage requires secrets.refs.s3AccessKey, secrets.data.s3AccessKey with secrets.create=true, or an existing Secret/Vault Secret" }}
{{- end }}
{{- if and (not $s3SecretKeyValue) (not $s3SecretKeyRefName) (not $externalSecretStore) }}
{{- fail "S3 storage requires secrets.refs.s3SecretKey, secrets.data.s3SecretKey with secrets.create=true, or an existing Secret/Vault Secret" }}
{{- end }}
{{- if and $s3AccessKeyValue (not .Values.secrets.create) (not .Values.secrets.vault.enabled) (not $s3AccessKeyRefName) }}
{{- fail "secrets.data.s3AccessKey requires secrets.create=true, secrets.vault.enabled=true, or secrets.refs.s3AccessKey.name" }}
{{- end }}
{{- if and $s3SecretKeyValue (not .Values.secrets.create) (not .Values.secrets.vault.enabled) (not $s3SecretKeyRefName) }}
{{- fail "secrets.data.s3SecretKey requires secrets.create=true, secrets.vault.enabled=true, or secrets.refs.s3SecretKey.name" }}
{{- end }}
{{- end }}
{{- $s3AccessKeyName := include "justai.secretRefName" (dict "root" . "ref" "s3AccessKey") -}}
{{- $s3AccessKeyKey := include "justai.secretRefKey" (dict "root" . "ref" "s3AccessKey") -}}
{{- $s3SecretKeyName := include "justai.secretRefName" (dict "root" . "ref" "s3SecretKey") -}}
{{- $s3SecretKeyKey := include "justai.secretRefKey" (dict "root" . "ref" "s3SecretKey") -}}
{{- $trustedCAConfigMap := .Values.trustedCA.existingConfigMap | default "" -}}
{{- $trustedCASecret := .Values.trustedCA.existingSecret | default "" -}}
{{- $trustedCAKey := .Values.trustedCA.key | default "ca.crt" -}}
{{- if and $trustedCAConfigMap $trustedCASecret }}
{{- fail "trustedCA accepts either existingConfigMap or existingSecret, not both" }}
{{- end }}
{{- $trustedCAEnabled := or $trustedCAConfigMap $trustedCASecret -}}
{{- $configName := printf "%s-backend-config" (include "justai.fullname" .) -}}
{{- $uploadsName := printf "%s-uploads" (include "justai.fullname" .) -}}
{{- if eq .Values.deploymentMode "monolith" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "justai.fullname" . }}
  labels:
    {{- include "justai.labels" . | nindent 4 }}
    app.kubernetes.io/component: monolith
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "justai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: monolith
  template:
    metadata:
      labels:
        {{- include "justai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: monolith
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "justai.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: justai
          image: "{{ .Values.monolith.image.repository }}:{{ .Values.monolith.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.monolith.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: frontend
              containerPort: {{ .Values.monolith.service.frontendPort }}
              protocol: TCP
            - name: backend
              containerPort: {{ .Values.monolith.service.backendPort }}
              protocol: TCP
          env:
            - name: JUSTAI_ENV
              value: {{ .Values.config.environment | quote }}
            - name: JUSTAI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $databaseURLName | quote }}
                  key: {{ $databaseURLKey | quote }}
            - name: JUSTAI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecretName | quote }}
                  key: {{ $jwtSecretKey | quote }}
            - name: JUSTAI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $encryptionKeyName | quote }}
                  key: {{ $encryptionKeyKey | quote }}
            {{- if $trustedCAEnabled }}
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/extra-ca.crt"
            {{- end }}
            {{- if $s3Enabled }}
            - name: JUSTAI_TRANSCRIPTION_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3AccessKeyName | quote }}
                  key: {{ $s3AccessKeyKey | quote }}
            - name: JUSTAI_TRANSCRIPTION_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3SecretKeyName | quote }}
                  key: {{ $s3SecretKeyKey | quote }}
            {{- end }}
            {{- with .Values.monolith.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.monolith.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: backend-config
              mountPath: /etc/justai/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: uploads
              mountPath: /app/data
            {{- if $trustedCAEnabled }}
            - name: trusted-ca
              mountPath: /etc/ssl/certs/extra-ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: backend
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: backend
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.monolith.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: backend-config
          configMap:
            name: {{ $configName }}
        - name: uploads
          {{- if .Values.uploads.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $uploadsName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $trustedCAEnabled }}
        - name: trusted-ca
          {{- if $trustedCAConfigMap }}
          configMap:
            name: {{ $trustedCAConfigMap | quote }}
            items:
              - key: {{ $trustedCAKey | quote }}
                path: ca.crt
          {{- else }}
          secret:
            secretName: {{ $trustedCASecret | quote }}
            items:
              - key: {{ $trustedCAKey | quote }}
                path: ca.crt
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
