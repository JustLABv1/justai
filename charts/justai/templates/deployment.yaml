          {{- end }}
        {{- if $trustedCAEnabled }}
        - name: trusted-ca
          {{- if $trustedCAConfigMap }}
          configMap:
            name: {{ $trustedCAConfigMap | quote }}
            items:
              - key: {{ $trustedCAKey | quote }}
                path: ca.crt
          {{- else }}
          secret:
            secretName: {{ $trustedCASecret | quote }}
            items:
              - key: {{ $trustedCAKey | quote }}
                path: ca.crt
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
