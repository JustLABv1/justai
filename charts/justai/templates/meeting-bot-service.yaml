{{- if .Values.meetingBot.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "justai.fullname" . }}-meeting-bot
  labels:
    {{- include "justai.labels" . | nindent 4 }}
    app.kubernetes.io/component: meeting-bot
spec:
  type: {{ .Values.meetingBot.service.type }}
  ports:
    - name: http
      port: {{ .Values.meetingBot.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "justai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: meeting-bot
{{- end }}
