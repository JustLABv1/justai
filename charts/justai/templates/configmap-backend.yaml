{{- $origins := .Values.config.frontendOrigins -}}
{{- if not $origins }}
{{- $origins = list (include "justai.publicOrigin" .) -}}
{{- end }}
{{- $oidcRedirect := .Values.config.oidc.redirectUrl | default (printf "%s/api/v1/auth/oidc/callback" (include "justai.publicOrigin" .)) -}}
{{- $mcpRedirect := .Values.config.mcpOAuthRedirectUrl | default (printf "%s/api/v1/mcp/oauth/callback" (include "justai.publicOrigin" .)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "justai.fullname" . }}-backend-config
  labels:
    {{- include "justai.labels" . | nindent 4 }}
data:
  config.yaml: |
    port: {{ .Values.config.port | quote }}
    database_url: ""
    jwt_secret: ""
    encryption_key: ""
    frontend_origins:
      {{- toYaml $origins | nindent 6 }}
    oidc:
      issuer: {{ .Values.config.oidc.issuer | quote }}
      client_id: {{ .Values.config.oidc.clientId | quote }}
      client_secret: ""
      redirect_url: {{ $oidcRedirect | quote }}
    mcp_oauth_redirect_url: {{ $mcpRedirect | quote }}
    allow_private_targets: {{ .Values.config.allowPrivateTargets }}
    dev_seed: {{ .Values.config.devSeed }}
    secure_cookies: {{ .Values.config.secureCookies }}
    cookie_same_site: {{ .Values.config.cookieSameSite | quote }}
    cookie_domain: {{ .Values.config.cookieDomain | quote }}
    transcription:
      storage_driver: {{ .Values.config.transcription.storageDriver | quote }}
      local_storage_path: {{ .Values.config.transcription.localStoragePath | quote }}
      s3_endpoint: {{ .Values.config.transcription.s3Endpoint | quote }}
      s3_processing_endpoint: {{ .Values.config.transcription.s3ProcessingEndpoint | quote }}
      s3_region: {{ .Values.config.transcription.s3Region | quote }}
      s3_bucket: {{ .Values.config.transcription.s3Bucket | quote }}
      audio_retention_days: {{ .Values.config.transcription.audioRetentionDays }}
      diarization_window_seconds: {{ .Values.config.transcription.diarizationWindowSeconds }}
      diarization_overlap_seconds: {{ .Values.config.transcription.diarizationOverlapSeconds }}
      streaming_chunk_ms: {{ .Values.config.transcription.streamingChunkMs }}
      streaming_overlap_ms: {{ .Values.config.transcription.streamingOverlapMs }}
      streaming_prompt_chars: {{ .Values.config.transcription.streamingPromptChars }}
      video_transcription_chunk_ms: {{ .Values.config.transcription.videoTranscriptionChunkMs }}
      video_transcription_overlap_ms: {{ .Values.config.transcription.videoTranscriptionOverlapMs }}
      video_transcription_workers: {{ .Values.config.transcription.videoTranscriptionWorkers }}
      video_transcription_worker_capacity: {{ .Values.config.transcription.videoTranscriptionWorkerCapacity }}
      max_session_hours: {{ .Values.config.transcription.maxSessionHours }}
      video_upload_max_bytes: {{ int64 .Values.config.transcription.videoUploadMaxBytes }}
      video_upload_part_bytes: {{ int64 .Values.config.transcription.videoUploadPartBytes }}
      video_max_duration_hours: {{ .Values.config.transcription.videoMaxDurationHours }}
      live_stream_reconnect_seconds: {{ .Values.config.transcription.liveStreamReconnectSeconds }}
