{{- if .Values.pyannote.enabled }}
{{- include "justai.validateSecretRefs" . -}}
{{- $globalSecretStore := or .Values.secrets.create .Values.secrets.existingSecret .Values.secrets.vault.enabled -}}
{{- $externalSecretStore := or .Values.secrets.existingSecret .Values.secrets.vault.enabled -}}
{{- $hfToken := .Values.secrets.data.pyannoteHfToken | default "" -}}
{{- $serviceToken := .Values.secrets.data.pyannoteServiceToken | default "" -}}
{{- $proxyHTTPValue := .Values.secrets.data.pyannoteHttpProxy | default "" -}}
{{- $proxyHTTPSValue := .Values.secrets.data.pyannoteHttpsProxy | default "" -}}
{{- $proxyNoProxyValue := .Values.secrets.data.pyannoteNoProxy | default "" -}}
{{- $hfTokenRefName := .Values.secrets.refs.pyannoteHfToken.name | default "" -}}
{{- $serviceTokenRefName := .Values.secrets.refs.pyannoteServiceToken.name | default "" -}}
{{- $proxyHTTPRefName := .Values.secrets.refs.pyannoteHttpProxy.name | default "" -}}
{{- $proxyHTTPSRefName := .Values.secrets.refs.pyannoteHttpsProxy.name | default "" -}}
{{- $proxyNoProxyRefName := .Values.secrets.refs.pyannoteNoProxy.name | default "" -}}
{{- $maxSourceBytes := int64 .Values.pyannote.maxSourceBytes -}}
{{- if or (lt $maxSourceBytes 1) (gt $maxSourceBytes 21474836480) }}
{{- fail "pyannote.maxSourceBytes must be an integer between 1 and 21474836480" }}
{{- end }}
{{- if and (not $hfTokenRefName) (not $hfToken) (not $externalSecretStore) }}
{{- fail "pyannote.enabled requires a Hugging Face token through secrets.refs.pyannoteHfToken, secrets.data.pyannoteHfToken with secrets.create=true, or an existing Secret/Vault Secret" }}
{{- end }}
{{- if not (gt (len .Values.pyannote.allowedMediaOrigins) 0) }}
{{- fail "pyannote.enabled requires pyannote.allowedMediaOrigins to contain exact media URL origins" }}
{{- end }}
{{- if and (not $serviceTokenRefName) (not $serviceToken) (not $externalSecretStore) }}
{{- fail "pyannote.enabled requires a service token through secrets.refs.pyannoteServiceToken, secrets.data.pyannoteServiceToken with secrets.create=true, or an existing Secret/Vault Secret" }}
{{- end }}
{{- if and $hfToken (not $globalSecretStore) (not $hfTokenRefName) }}
{{- fail "secrets.data.pyannoteHfToken requires secrets.create=true, secrets.vault.enabled=true, or secrets.refs.pyannoteHfToken.name" }}
{{- end }}
{{- if and $serviceToken (not $globalSecretStore) (not $serviceTokenRefName) }}
{{- fail "secrets.data.pyannoteServiceToken requires secrets.create=true, secrets.vault.enabled=true, or secrets.refs.pyannoteServiceToken.name" }}
{{- end }}
{{- if and $proxyHTTPValue (not $globalSecretStore) (not $proxyHTTPRefName) }}
{{- fail "secrets.data.pyannoteHttpProxy requires secrets.create=true, secrets.vault.enabled=true, or secrets.refs.pyannoteHttpProxy.name" }}
{{- end }}
{{- if and $proxyHTTPSValue (not $globalSecretStore) (not $proxyHTTPSRefName) }}
{{- fail "secrets.data.pyannoteHttpsProxy requires secrets.create=true, secrets.vault.enabled=true, or secrets.refs.pyannoteHttpsProxy.name" }}
{{- end }}
{{- if and $proxyNoProxyValue (not $globalSecretStore) (not $proxyNoProxyRefName) }}
{{- fail "secrets.data.pyannoteNoProxy requires secrets.create=true, secrets.vault.enabled=true, or secrets.refs.pyannoteNoProxy.name" }}
{{- end }}
{{- $sharedSecret := include "justai.secretRefName" (dict "root" . "ref" "pyannoteHfToken") -}}
{{- $sharedHfKey := include "justai.secretRefKey" (dict "root" . "ref" "pyannoteHfToken") -}}
{{- $sharedServiceSecret := include "justai.secretRefName" (dict "root" . "ref" "pyannoteServiceToken") -}}
{{- $sharedServiceKey := include "justai.secretRefKey" (dict "root" . "ref" "pyannoteServiceToken") -}}
{{- $proxyHTTPConfigured := or $proxyHTTPValue $proxyHTTPRefName -}}
{{- $proxyHTTPSConfigured := or $proxyHTTPSValue $proxyHTTPSRefName -}}
{{- $proxyNoProxyConfigured := or $proxyNoProxyValue $proxyNoProxyRefName -}}
{{- $proxyHTTPSecret := include "justai.secretRefName" (dict "root" . "ref" "pyannoteHttpProxy") -}}
{{- $proxyHTTPKey := include "justai.secretRefKey" (dict "root" . "ref" "pyannoteHttpProxy") -}}
{{- $proxyHTTPSSecret := include "justai.secretRefName" (dict "root" . "ref" "pyannoteHttpsProxy") -}}
{{- $proxyHTTPSKey := include "justai.secretRefKey" (dict "root" . "ref" "pyannoteHttpsProxy") -}}
{{- $proxyNoProxySecret := include "justai.secretRefName" (dict "root" . "ref" "pyannoteNoProxy") -}}
{{- $proxyNoProxyKey := include "justai.secretRefKey" (dict "root" . "ref" "pyannoteNoProxy") -}}
{{- $noProxy := .Values.pyannote.proxy.noProxy -}}
{{- if kindIs "slice" $noProxy }}{{- $noProxy = join "," $noProxy -}}{{- end }}
{{- $trustedCAConfigMap := .Values.pyannote.trustedCA.existingConfigMap | default "" -}}
{{- $trustedCASecret := .Values.pyannote.trustedCA.existingSecret | default "" -}}
{{- $trustedCAKey := .Values.pyannote.trustedCA.key | default "ca.crt" -}}
{{- if and $trustedCAConfigMap $trustedCASecret }}
{{- fail "pyannote.trustedCA accepts either existingConfigMap or existingSecret, not both" }}
{{- end }}
{{- $trustedCAEnabled := or $trustedCAConfigMap $trustedCASecret -}}
{{- $imageTag := .Values.pyannote.image.tag | default (printf "pyannote-%s" .Chart.AppVersion) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "justai.fullname" . }}-pyannote
  labels:
    {{- include "justai.labels" . | nindent 4 }}
    app.kubernetes.io/component: pyannote
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "justai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pyannote
  template:
    metadata:
      labels:
        {{- include "justai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pyannote
      {{- with .Values.pyannote.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "justai.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pyannote.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if $trustedCAEnabled }}
      initContainers:
        - name: trusted-ca-bundle
          image: "{{ .Values.pyannote.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.pyannote.image.pullPolicy }}
          command: ["/opt/venv/bin/python", "-c"]
          args:
            - >-
              from pathlib import Path;
              Path("/output-ca/ca-certificates.crt").write_bytes(
                Path("/etc/ssl/certs/ca-certificates.crt").read_bytes()
                + b"\n"
                + Path("/input-ca/corporate-ca.crt").read_bytes()
              )
          volumeMounts:
            - name: trusted-ca-input
              mountPath: /input-ca
              readOnly: true
            - name: trusted-ca-bundle
              mountPath: /output-ca
      {{- end }}
      containers:
        - name: pyannote
          image: "{{ .Values.pyannote.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.pyannote.image.pullPolicy }}
          {{- with .Values.pyannote.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.pyannote.service.port }}
              protocol: TCP
          env:
            - name: PYANNOTE_MODEL_ID
              value: {{ .Values.pyannote.modelId | quote }}
            - name: PYANNOTE_DEVICE
              value: {{ .Values.pyannote.device | quote }}
            - name: PYANNOTE_MIN_AUDIO_SECONDS
              value: {{ .Values.pyannote.minAudioSeconds | quote }}
            - name: PYANNOTE_TORCH_THREADS
              value: {{ .Values.pyannote.torchThreads | quote }}
            - name: PYANNOTE_DOWNLOAD_TIMEOUT_SECONDS
              value: {{ .Values.pyannote.downloadTimeoutSeconds | quote }}
            - name: PYANNOTE_MAX_SOURCE_BYTES
              value: {{ .Values.pyannote.maxSourceBytes | quote }}
            - name: PYANNOTE_ALLOWED_MEDIA_ORIGINS
              value: {{ join "," .Values.pyannote.allowedMediaOrigins | quote }}
            - name: PYANNOTE_ALLOW_PRIVATE_MEDIA_ORIGINS
              value: {{ join "," .Values.pyannote.allowPrivateMediaOrigins | quote }}
            - name: HF_HOME
              value: /tmp/huggingface
            - name: HUGGINGFACE_HUB_CACHE
              value: /tmp/huggingface/hub
            {{- if $trustedCAEnabled }}
            - name: SSL_CERT_FILE
              value: /tmp/trusted-ca/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /tmp/trusted-ca/ca-certificates.crt
            {{- end }}
            {{- if .Values.pyannote.proxy.http }}
            - name: HTTP_PROXY
              value: {{ .Values.pyannote.proxy.http | quote }}
            {{- else if $proxyHTTPConfigured }}
            - name: HTTP_PROXY
              valueFrom:
                secretKeyRef:
                  name: {{ $proxyHTTPSecret | quote }}
                  key: {{ $proxyHTTPKey | quote }}
            {{- end }}
            {{- if .Values.pyannote.proxy.https }}
            - name: HTTPS_PROXY
              value: {{ .Values.pyannote.proxy.https | quote }}
            {{- else if $proxyHTTPSConfigured }}
            - name: HTTPS_PROXY
              valueFrom:
                secretKeyRef:
                  name: {{ $proxyHTTPSSecret | quote }}
                  key: {{ $proxyHTTPSKey | quote }}
            {{- end }}
            {{- if $noProxy }}
            - name: NO_PROXY
              value: {{ $noProxy | quote }}
            {{- else if $proxyNoProxyConfigured }}
            - name: NO_PROXY
              valueFrom:
                secretKeyRef:
                  name: {{ $proxyNoProxySecret | quote }}
                  key: {{ $proxyNoProxyKey | quote }}
            {{- end }}
            {{- if or $globalSecretStore $hfTokenRefName }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $sharedSecret | quote }}
                  key: {{ $sharedHfKey | quote }}
            {{- end }}
            {{- if or $globalSecretStore $serviceTokenRefName }}
            - name: PYANNOTE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $sharedServiceSecret | quote }}
                  key: {{ $sharedServiceKey | quote }}
            {{- end }}
            {{- with .Values.pyannote.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.pyannote.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.pyannote.cache.persistence.enabled }}
          volumeMounts:
            - name: huggingface-cache
              mountPath: /tmp/huggingface
            {{- if $trustedCAEnabled }}
            - name: trusted-ca-bundle
              mountPath: /tmp/trusted-ca
              readOnly: true
            {{- end }}
          {{- else if $trustedCAEnabled }}
          volumeMounts:
            - name: trusted-ca-bundle
              mountPath: /tmp/trusted-ca
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: {{ .Values.pyannote.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.pyannote.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.pyannote.startupProbe.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.pyannote.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.pyannote.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.pyannote.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.pyannote.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.pyannote.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.pyannote.readinessProbe.failureThreshold }}
          {{- with .Values.pyannote.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.pyannote.cache.persistence.enabled $trustedCAEnabled }}
      volumes:
        {{- if .Values.pyannote.cache.persistence.enabled }}
        - name: huggingface-cache
          persistentVolumeClaim:
            claimName: {{ include "justai.fullname" . }}-pyannote-cache
        {{- end }}
        {{- if $trustedCAEnabled }}
        - name: trusted-ca-input
          {{- if $trustedCAConfigMap }}
          configMap:
            name: {{ $trustedCAConfigMap | quote }}
            items:
              - key: {{ $trustedCAKey | quote }}
                path: corporate-ca.crt
          {{- else }}
          secret:
            secretName: {{ $trustedCASecret | quote }}
            items:
              - key: {{ $trustedCAKey | quote }}
                path: corporate-ca.crt
          {{- end }}
        - name: trusted-ca-bundle
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.pyannote.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pyannote.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pyannote.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "justai.fullname" . }}-pyannote
  labels:
    {{- include "justai.labels" . | nindent 4 }}
    app.kubernetes.io/component: pyannote
spec:
  type: {{ .Values.pyannote.service.type }}
  ports:
    - name: http
      port: {{ .Values.pyannote.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "justai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pyannote
{{- end }}
