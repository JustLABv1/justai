{{- if and .Values.pyannote.enabled .Values.pyannote.cache.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "justai.fullname" . }}-pyannote-cache
  labels:
    {{- include "justai.labels" . | nindent 4 }}
    app.kubernetes.io/component: pyannote
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.pyannote.cache.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.pyannote.cache.persistence.size }}
{{- end }}
