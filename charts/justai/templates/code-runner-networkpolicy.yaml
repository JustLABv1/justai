{{- if and .Values.codeRunner.enabled .Values.codeRunner.networkPolicy.enabled }}
# The runner executes untrusted code: only the JustAI backend may connect to it,
# and it may not open any connection itself (no egress rules at all).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "justai.fullname" . }}-code-runner
  labels:
    {{- include "justai.labels" . | nindent 4 }}
    app.kubernetes.io/component: code-runner
spec:
  podSelector:
    matchLabels:
      {{- include "justai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: code-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "justai.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - backend
                  - monolith
      ports:
        - protocol: TCP
          port: 8090
  egress: []
{{- end }}
