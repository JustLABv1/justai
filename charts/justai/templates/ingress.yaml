{{- if .Values.ingress.enabled }}
{{- $fullName := include "justai.fullname" . -}}
{{- $backendService := printf "%s-backend" $fullName -}}
{{- $frontendService := printf "%s-frontend" $fullName -}}
{{- $frontendPort := .Values.frontend.service.port -}}
{{- $backendPort := .Values.backend.service.port -}}
{{- if eq .Values.deploymentMode "monolith" }}
{{- $backendService = $fullName -}}
{{- $frontendService = $fullName -}}
{{- $frontendPort = .Values.monolith.service.port -}}
{{- $backendPort = .Values.monolith.service.backendPort -}}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1beta1
{{- else }}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "justai.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- $useBackend := default false .backend }}
          - path: {{ .path }}
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: {{ .pathType | default "Prefix" }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ .serviceName | default (ternary $backendService $frontendService $useBackend) }}
                port:
                  number: {{ .port | default (ternary $backendPort $frontendPort $useBackend) }}
              {{- else }}
              serviceName: {{ .serviceName | default (ternary $backendService $frontendService $useBackend) }}
              servicePort: {{ .port | default (ternary $backendPort $frontendPort $useBackend) }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
