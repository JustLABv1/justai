{{- if and .Values.secrets.create (not .Values.secrets.vault.enabled) }}
{{- include "justai.validateManagedSecretRefs" . }}
{{- $generatedName := printf "%s-secrets" (include "justai.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $generatedName }}
  labels:
    {{- include "justai.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "justai.secretRefKey" (dict "root" . "ref" "databaseURL") | quote }}: {{ include "justai.databaseURL" . | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "postgresqlPassword") | quote }}: {{ .Values.secrets.data.postgresqlPassword | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "jwtSecret") | quote }}: {{ .Values.secrets.data.jwtSecret | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "encryptionKey") | quote }}: {{ .Values.secrets.data.encryptionKey | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "pyannoteHfToken") | quote }}: {{ .Values.secrets.data.pyannoteHfToken | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "pyannoteServiceToken") | quote }}: {{ .Values.secrets.data.pyannoteServiceToken | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "pyannoteHttpProxy") | quote }}: {{ .Values.secrets.data.pyannoteHttpProxy | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "pyannoteHttpsProxy") | quote }}: {{ .Values.secrets.data.pyannoteHttpsProxy | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "pyannoteNoProxy") | quote }}: {{ .Values.secrets.data.pyannoteNoProxy | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "s3AccessKey") | quote }}: {{ .Values.secrets.data.s3AccessKey | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "s3SecretKey") | quote }}: {{ .Values.secrets.data.s3SecretKey | default "" | b64enc | quote }}
{{- end }}
