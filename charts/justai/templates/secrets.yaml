{{- if and .Values.secrets.create (not .Values.secrets.vault.enabled) }}
{{- include "justai.validateManagedSecretRefs" . }}
{{- $generatedName := printf "%s-secrets" (include "justai.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $generatedName }}
  labels:
    {{- include "justai.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "justai.secretRefKey" (dict "root" . "ref" "databaseURL") | quote }}: {{ include "justai.databaseURL" . | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "postgresqlPassword") | quote }}: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "jwtSecret") | quote }}: {{ .Values.config.jwtSecret | default "" | b64enc | quote }}
  {{ include "justai.secretRefKey" (dict "root" . "ref" "encryptionKey") | quote }}: {{ .Values.config.encryptionKey | default "" | b64enc | quote }}
{{- end }}
