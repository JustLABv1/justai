# Copy this file to config.yaml and start the backend with:
#   go run . --config ./config.yaml
#
# config.yaml is gitignored. Keep real credentials out of the repository.

port: "8080"
database_url: "postgres://justai:justai@localhost:54329/justai?sslmode=disable"
jwt_secret: "replace-with-a-long-development-secret"
encryption_key: "replace-with-a-long-development-encryption-key"
frontend_origins:
  - "http://localhost:3000"

oidc:
  issuer: ""
  client_id: ""
  client_secret: ""
  redirect_url: ""

mcp_oauth_redirect_url: "http://localhost:8080/api/v1/mcp/oauth/callback"
allow_private_targets: false
dev_seed: true
# Maximum text files retained in one repository snapshot (default: 200).
repository_max_files: 200

transcription:
  # Choose one: local or s3. Audio recording is opt-in per session.
  storage_driver: "local"
  local_storage_path: "./data/transcription"
  s3_endpoint: ""
  # Optional endpoint used only in presigned URLs sent to worker containers.
  # Keep s3_endpoint browser-reachable; for Podman with MinIO on the host,
  # use http://host.containers.internal:9000 here.
  s3_processing_endpoint: ""
  s3_region: "us-east-1"
  s3_bucket: ""
  s3_access_key: ""
  s3_secret_key: ""
  audio_retention_days: 30
  diarization_window_seconds: 30
  diarization_overlap_seconds: 5
  # Rolling HTTP transcription for Whisper-style endpoints.
  streaming_chunk_ms: 2500
  streaming_overlap_ms: 500
  # Keep the decoder prompt well below Whisper's small text context window.
  streaming_prompt_chars: 160
  # Long videos are extracted once and transcribed in overlapping slices.
  video_transcription_chunk_ms: 600000
  video_transcription_overlap_ms: 5000
  video_transcription_workers: 3
  max_session_hours: 8
  # Direct-to-S3 multipart video uploads and their processing bounds. Video
  # uploads require storage_driver: s3.
  video_upload_max_bytes: 5368709120
  video_upload_part_bytes: 16777216
  video_max_duration_hours: 4
