name: JustAI CI

on:
  push:
  pull_request:

concurrency:
  group: justai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/backend/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: justai
          POSTGRES_USER: justai
          POSTGRES_PASSWORD: justai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U justai -d justai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/backend
    env:
      JUSTAI_DATABASE_URL: postgres://justai:justai@localhost:5432/justai?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/backend/go.sum
      - run: go test -tags integration ./database

  smoke:
    runs-on: ubuntu-latest
    needs: [frontend, backend, database-integration, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Start the production-shaped stack
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for backend readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.dev.yml logs
          exit 1
      - name: Check public contracts
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/v1/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:8080/api/v1/auth/config >/dev/null
          curl --fail --silent http://127.0.0.1:3000/login >/dev/null
      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --target backend --tag justai-backend:ci .
      - name: Build frontend image
        run: docker build --target frontend --tag justai-frontend:ci .
      - name: Validate compose configuration
        run: docker compose -f docker-compose.dev.yml config
