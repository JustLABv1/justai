name: Build Image (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and push'
        required: true
        default: 'main'

env:
  IMAGE: ghcr.io/justlabv1/justai
  FFMPEG_IMAGE: ghcr.io/justlabv1/justai-ffmpeg
  FFMPEG_TAG: 9.0.1-openssl-3.5.7

jobs:
  build:
    name: Build & Push JustAI Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Shared FFmpeg
        id: ffmpeg
        uses: docker/build-push-action@v7
        with:
          context: docker/ffmpeg
          file: docker/ffmpeg/Dockerfile
          push: true
          tags: ${{ env.FFMPEG_IMAGE }}:${{ env.FFMPEG_TAG }}
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,scope=ffmpeg,mode=max
          provenance: mode=max
          sbom: true

      - name: Build & Push Backend
        uses: docker/build-push-action@v7
        with:
          context: services/backend
          file: services/backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:backend-${{ github.event.inputs.branch }}
          build-contexts: |
            ffmpeg-builder=docker-image://${{ env.FFMPEG_IMAGE }}@${{ steps.ffmpeg.outputs.digest }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:frontend-${{ github.event.inputs.branch }}
          # The production image uses same-origin /api/v1 requests. nginx or
          # an ingress routes those requests to the backend service.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build & Push Combined
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.inputs.branch }}
          build-contexts: |
            ffmpeg-builder=docker-image://${{ env.FFMPEG_IMAGE }}@${{ steps.ffmpeg.outputs.digest }}
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Build & Push Pyannote
        uses: docker/build-push-action@v7
        with:
          context: services/pyannote-diarizer
          file: services/pyannote-diarizer/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:pyannote-${{ github.event.inputs.branch }}
          build-contexts: |
            ffmpeg-builder=docker-image://${{ env.FFMPEG_IMAGE }}@${{ steps.ffmpeg.outputs.digest }}
          cache-from: type=gha,scope=pyannote
          cache-to: type=gha,scope=pyannote,mode=max
