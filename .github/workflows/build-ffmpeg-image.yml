name: Build Shared FFmpeg Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/ffmpeg/**'
      - '.github/workflows/build-ffmpeg-image.yml'
  workflow_dispatch:

concurrency:
  group: shared-ffmpeg-image
  cancel-in-progress: false

env:
  FFMPEG_IMAGE: ghcr.io/justlabv1/justai-ffmpeg
  FFMPEG_TAG: 9.0.1-openssl-3.5.7

jobs:
  build:
    name: Build & Push Shared FFmpeg Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push shared FFmpeg artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker/ffmpeg
          file: docker/ffmpeg/Dockerfile
          push: true
          tags: |
            ${{ env.FFMPEG_IMAGE }}:${{ env.FFMPEG_TAG }}
            ${{ env.FFMPEG_IMAGE }}:latest
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,scope=ffmpeg,mode=max
          provenance: mode=max
          sbom: true
