name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
  workflow_dispatch:
    inputs:
      chart_version:
        description: Helm chart version to publish
        required: true
      app_version:
        description: App version for chart appVersion and default image tags
        required: true

env:
  IMAGE: ghcr.io/justlabv1/justai
  FFMPEG_IMAGE: ghcr.io/justlabv1/justai-ffmpeg
  FFMPEG_TAG: 9.0.1-openssl-3.5.9
  HELM_CHART: justai
  HELM_CHART_PATH: charts/justai
  HELM_REGISTRY: ghcr.io/justlabv1/charts

# Order:
#   1. ffmpeg            Resolve the shared FFmpeg artifact. It only changes with
#                        docker/ffmpeg, so an image built from the same sources is
#                        reused instead of compiling FFmpeg again.
#   2. core images       frontend and code-runner start immediately; backend and
#                        stream-relay start as soon as the FFmpeg digest is known.
#   3. remaining images  combined and pyannote (CPU/GPU in parallel) only start once
#                        every core image is published, so a broken core build does
#                        not burn the slowest builds.
#   4. helm chart        published after every image it references exists.
#   5. GitHub release
jobs:
  # ── Stage 1: shared FFmpeg artifact ─────────────────────────────────────

  build-ffmpeg:
    name: Resolve Shared FFmpeg Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fingerprint FFmpeg sources
        id: source
        # Git's tree hash changes with any file below docker/ffmpeg.
        run: echo "tag=src-$(git rev-parse --short=16 HEAD:docker/ffmpeg)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse FFmpeg image built from identical sources
        id: existing
        env:
          REF: ${{ env.FFMPEG_IMAGE }}:${{ steps.source.outputs.tag }}
        run: |
          if digest="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>/dev/null)" && [[ "$digest" == sha256:* ]]; then
            echo "Reusing $REF ($digest)"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "No FFmpeg image for these sources yet; building it."
          fi

      - name: Build and push shared FFmpeg artifact
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker/ffmpeg
          file: docker/ffmpeg/Dockerfile
          push: true
          tags: |
            ${{ env.FFMPEG_IMAGE }}:${{ env.FFMPEG_TAG }}
            ${{ env.FFMPEG_IMAGE }}:${{ steps.source.outputs.tag }}
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,scope=ffmpeg,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish digest
        id: result
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "Could not resolve the FFmpeg image digest" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # ── Stage 2: core images ────────────────────────────────────────────────

  build-frontend:
    name: Build & Push Frontend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=frontend-
            type=raw,value=frontend-beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=frontend-latest,enable=${{ !contains(github.ref_name, '-beta.') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          # NEXT_PUBLIC_API_URL is intentionally empty so API calls use relative paths (/api/v1/...).
          # nginx routes /api/* to the backend — works on any domain without rebuilding.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  build-code-runner:
    name: Build & Push Code Runner Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=code-runner-
            type=raw,value=code-runner-beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=code-runner-latest,enable=${{ !contains(github.ref_name, '-beta.') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/code-runner
          file: services/code-runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=code-runner
          cache-to: type=gha,scope=code-runner,mode=max
          provenance: mode=max
          sbom: true

  build-meeting-bot:
    name: Build & Push Meeting Bot Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=meeting-bot-
            type=raw,value=meeting-bot-beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=meeting-bot-latest,enable=${{ !contains(github.ref_name, '-beta.') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/meeting-bot
          file: services/meeting-bot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=meeting-bot
          cache-to: type=gha,scope=meeting-bot,mode=max
          provenance: mode=max
          sbom: true

  build-backend:
    name: Build & Push Backend
    if: github.event_name == 'push'
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=backend-
            type=raw,value=backend-beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=backend-latest,enable=${{ !contains(github.ref_name, '-beta.') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/backend
          file: services/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          build-contexts: |
            ffmpeg-builder=docker-image://${{ env.FFMPEG_IMAGE }}@${{ needs.build-ffmpeg.outputs.digest }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-stream-relay:
    name: Build & Push Stream Relay
    if: github.event_name == 'push'
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=relay-
            type=raw,value=relay-beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=relay-latest,enable=${{ !contains(github.ref_name, '-beta.') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/backend
          file: services/backend/Dockerfile
          target: stream-relay
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: |
            ffmpeg-builder=docker-image://${{ env.FFMPEG_IMAGE }}@${{ needs.build-ffmpeg.outputs.digest }}
          cache-from: type=gha,scope=stream-relay
          cache-to: type=gha,scope=stream-relay,mode=max
          provenance: mode=max
          sbom: true

  # ── Stage 3: remaining images ───────────────────────────────────────────

  build-combined:
    name: Build & Push Combined Image
    if: github.event_name == 'push'
    needs: [build-ffmpeg, build-frontend, build-code-runner, build-backend, build-stream-relay]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-beta.') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          build-contexts: |
            ffmpeg-builder=docker-image://${{ env.FFMPEG_IMAGE }}@${{ needs.build-ffmpeg.outputs.digest }}
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

  build-pyannote:
    name: Build & Push Pyannote Image (${{ matrix.variant }})
    if: github.event_name == 'push'
    needs: [build-ffmpeg, build-frontend, build-code-runner, build-backend, build-stream-relay]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # CPU and GPU images are independent; build them side by side.
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            prefix: pyannote
            torch_index_url: https://download.pytorch.org/whl/cpu
          - variant: gpu
            prefix: pyannote-gpu
            torch_index_url: https://download.pytorch.org/whl/cu130
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=${{ matrix.prefix }}-
            type=raw,value=${{ matrix.prefix }}-beta,enable=${{ contains(github.ref_name, '-beta.') }}
            type=raw,value=${{ matrix.prefix }}-latest,enable=${{ !contains(github.ref_name, '-beta.') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/pyannote-diarizer
          file: services/pyannote-diarizer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            TORCH_INDEX_URL=${{ matrix.torch_index_url }}
          build-contexts: |
            ffmpeg-builder=docker-image://${{ env.FFMPEG_IMAGE }}@${{ needs.build-ffmpeg.outputs.digest }}
          cache-from: type=gha,scope=${{ matrix.prefix }}
          cache-to: type=gha,scope=${{ matrix.prefix }},mode=max

  # ── Stage 4: chart, once every image it references exists ──────────────
  # On workflow_dispatch the image jobs are skipped and the chart is published
  # on its own; on a tag push any failed image build stops it.
  release-helm-chart:
    name: Package & Push Helm Chart
    needs: [build-frontend, build-code-runner, build-meeting-bot, build-backend, build-stream-relay, build-combined, build-pyannote]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      is_beta: ${{ steps.vars.outputs.is_beta }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Resolve release versions
        id: vars
        shell: bash
        env:
          INPUT_CHART_VERSION: ${{ github.event.inputs.chart_version }}
          INPUT_APP_VERSION: ${{ github.event.inputs.app_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            chart_version="$INPUT_CHART_VERSION"
            app_version="$INPUT_APP_VERSION"
          else
            # Strip 'v' prefix from tag (e.g., v1.0.0-beta.1 -> 1.0.0-beta.1)
            raw_version="${GITHUB_REF_NAME#v}"
            chart_version="$raw_version"
            app_version="$raw_version"
          fi

          if [[ -z "$chart_version" || -z "$app_version" ]]; then
            echo "chart_version and app_version must be set" >&2
            exit 1
          fi

          # Determine if this is a beta release
          if [[ "$GITHUB_REF_NAME" =~ -beta\. ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Build chart dependencies
        run: helm dependency build "${{ env.HELM_CHART_PATH }}"

      - name: Lint chart
        run: helm lint "${{ env.HELM_CHART_PATH }}"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "${{ env.HELM_CHART_PATH }}" \
            --destination dist \
            --version "${{ steps.vars.outputs.chart_version }}" \
            --app-version "${{ steps.vars.outputs.app_version }}"

      - name: Login to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        run: helm push "dist/${{ env.HELM_CHART }}-${{ steps.vars.outputs.chart_version }}.tgz" "oci://${{ env.HELM_REGISTRY }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helm-chart
          path: dist/${{ env.HELM_CHART }}-${{ steps.vars.outputs.chart_version }}.tgz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-frontend, build-code-runner, build-meeting-bot, build-backend, build-stream-relay, build-combined, build-pyannote, release-helm-chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: helm-chart
          path: dist

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          name: Release ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          skipIfReleaseExists: true
          generateReleaseNotes: true
          prerelease: ${{ needs.release-helm-chart.outputs.is_beta == 'true' }}
          artifacts: dist/*
          artifactErrorsFailBuild: true
