name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  FFMPEG_IMAGE: ghcr.io/justlabv1/justai-ffmpeg
  FFMPEG_TAG: 9.0.1-openssl-3.5.7

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend_image: ${{ steps.filter.outputs.frontend_image }}
      backend_image: ${{ steps.filter.outputs.backend_image }}
      combined_image: ${{ steps.filter.outputs.combined_image }}
      ffmpeg_image: ${{ steps.filter.outputs.ffmpeg_image }}
      pyannote: ${{ steps.filter.outputs.pyannote }}
      pyannote_image: ${{ steps.filter.outputs.pyannote_image }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/check-image-build.yml'
            backend:
              - 'services/backend/**'
              - '.github/workflows/check-image-build.yml'
            frontend_image:
              - 'services/frontend/Dockerfile'
            backend_image:
              - 'services/backend/Dockerfile'
            combined_image:
              - 'Dockerfile'
            ffmpeg_image:
              - 'docker/ffmpeg/**'
              - '.github/workflows/build-ffmpeg-image.yml'
            pyannote:
              - 'services/pyannote-diarizer/**'
              - '.github/workflows/check-image-build.yml'
            pyannote_image:
              - 'services/pyannote-diarizer/Dockerfile'
              - 'services/pyannote-diarizer/requirements.txt'
              - 'services/pyannote-diarizer/app.py'
              - 'services/pyannote-diarizer/model_sync.py'

  frontend-compile:
    name: Frontend — Compile Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: services/frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend-compile:
    name: Backend — Compile Check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum

      - name: Build
        working-directory: services/backend
        run: go build ./...

  frontend-image-build:
    name: Frontend — Docker Build Check
    needs: changes
    if: needs.changes.outputs.frontend_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  resolve-ffmpeg-artifact:
    name: Resolve Shared FFmpeg Artifact
    needs: changes
    if: |
      needs.changes.outputs.backend_image == 'true' ||
      needs.changes.outputs.combined_image == 'true' ||
      needs.changes.outputs.pyannote_image == 'true'
    runs-on: ubuntu-latest
    outputs:
      context: ${{ steps.resolve.outputs.context }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve optional named context
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          reference="${FFMPEG_IMAGE}:${FFMPEG_TAG}"
          if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
            echo "context=ffmpeg-builder=docker-image://${reference}" >> "$GITHUB_OUTPUT"
          else
            echo 'context=' >> "$GITHUB_OUTPUT"
            echo 'Shared artifact unavailable; using the source-build fallback.'
          fi

  backend-image-build:
    name: Backend — Docker Build Check
    needs: [changes, resolve-ffmpeg-artifact]
    if: needs.changes.outputs.backend_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/backend
          file: services/backend/Dockerfile
          push: false
          build-contexts: ${{ needs.resolve-ffmpeg-artifact.outputs.context }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  combined-image-build:
    name: Combined — Docker Build Check
    needs: [changes, resolve-ffmpeg-artifact]
    if: needs.changes.outputs.combined_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          build-contexts: ${{ needs.resolve-ffmpeg-artifact.outputs.context }}
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

  ffmpeg-image-build:
    name: Shared FFmpeg — Docker Build Check
    needs: changes
    if: needs.changes.outputs.ffmpeg_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: docker/ffmpeg
          file: docker/ffmpeg/Dockerfile
          push: false
          load: true
          tags: justai-ffmpeg:ci
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,scope=ffmpeg,mode=max
      - name: Verify runtime binaries
        run: |
          set -euo pipefail
          docker run --rm justai-ffmpeg:ci -version | grep -F 'ffmpeg version 9.0.1'
          docker run --rm --entrypoint /opt/ffmpeg/bin/ffprobe justai-ffmpeg:ci -version | grep -F 'ffprobe version 9.0.1'

  pyannote-compile:
    name: Pyannote — Compile Check
    needs: changes
    if: needs.changes.outputs.pyannote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - name: Compile service
        run: python -m py_compile services/pyannote-diarizer/app.py services/pyannote-diarizer/model_sync.py

  pyannote-image-build:
    name: Pyannote — Docker Build Check
    needs: [changes, resolve-ffmpeg-artifact]
    if: needs.changes.outputs.pyannote_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/pyannote-diarizer
          file: services/pyannote-diarizer/Dockerfile
          push: false
          load: true
          tags: justai-pyannote:ci
          build-contexts: ${{ needs.resolve-ffmpeg-artifact.outputs.context }}
          cache-from: type=gha,scope=pyannote
          cache-to: type=gha,scope=pyannote,mode=max
      - name: Verify runtime Python packaging
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint python justai-pyannote:ci -m pip --version; then
            echo "pip must not be present in the pyannote runtime image"
            exit 1
          fi
          docker run --rm --entrypoint python justai-pyannote:ci -c 'import importlib.metadata as metadata, importlib.util, pathlib; installed = {dist.metadata["Name"].lower() for dist in metadata.distributions() if dist.metadata["Name"]}; forbidden = {"pip", "setuptools"}; assert all(importlib.util.find_spec(name) is None for name in forbidden); assert not forbidden.intersection(installed); assert not list(pathlib.Path("/opt/venv/bin").glob("pip*"))'
          docker run --rm --entrypoint /usr/bin/python justai-pyannote:ci -c 'import importlib.util, pathlib, site; roots = [pathlib.Path(path) for path in site.getsitepackages()]; assert all(importlib.util.find_spec(name) is None for name in ("pip", "setuptools", "pkg_resources", "_distutils_hack")); assert all(not list(root.rglob("bom.cdx.json")) for root in roots); assert not pathlib.Path("/usr/share/python-wheels").exists()'
          docker run --rm --entrypoint /opt/venv/bin/python -e HF_TOKEN=test-token -e PYANNOTE_SERVICE_TOKEN=0123456789abcdef -e PYANNOTE_ALLOWED_MEDIA_ORIGINS=https://s3.example.com -e PYANNOTE_MAX_SOURCE_BYTES=21474836480 justai-pyannote:ci -c 'import sys, types, warnings; runtime = type("Runtime", (), {"to": lambda self, device: self}); loader = lambda model, token=None: runtime(); pipeline = type("Pipeline", (), {"from_pretrained": staticmethod(loader)}); audio = types.ModuleType("pyannote.audio"); audio.Pipeline = pipeline; speaker = types.ModuleType("pyannote.audio.pipelines.speaker_diarization"); speaker.get_plda = lambda *args, **kwargs: None; pipelines = types.ModuleType("pyannote.audio.pipelines"); pipelines.speaker_diarization = speaker; package = types.ModuleType("pyannote"); package.audio = audio; sys.modules["pyannote"] = package; sys.modules["pyannote.audio"] = audio; sys.modules["pyannote.audio.pipelines"] = pipelines; sys.modules["pyannote.audio.pipelines.speaker_diarization"] = speaker; import app, matplotlib, pathlib; cache = pathlib.Path(matplotlib.get_cachedir()); cache.mkdir(parents=True, exist_ok=True); probe = cache / "write-test"; probe.write_text("ok"); probe.unlink(); assert app.MAX_SOURCE_BYTES == 20 * 1024**3; caught = []; warnings.showwarning = lambda *args, **kwargs: caught.append(args); warnings.warn_explicit("\ntorchcodec is not installed correctly", UserWarning, "io.py", 48, module="pyannote.audio.core.io"); assert not caught; assert str(cache) == "/tmp/matplotlib"'
          layers="$(docker image inspect justai-pyannote:ci --format '{{ len .RootFS.Layers }}')"
          test "$layers" -lt "11"
