# Standalone, configured ONLY through environment variables (no files to mount).
# TLS terminates at your ingress/load balancer, which connects to 127.0.0.1:8080.
# Put RELAY_SOURCES and RELAY_TOKEN in a protected .env file (chmod 600).
# Env vars are easier to leak than file-backed secrets (docker inspect), so prefer
# compose.ingress.yaml if other users can inspect containers on this host.
name: justai-stream-relay
services:
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/justlabv1/justai:relay-latest}
    restart: unless-stopped
    init: true
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    ulimits:
      nofile: {soft: 256, hard: 256}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      RELAY_HTTP: "true"
      RELAY_SOURCES: ${RELAY_SOURCES:?Set RELAY_SOURCES, e.g. radio=https://host/stream.mp3}
      RELAY_TOKEN: ${RELAY_TOKEN:?Set RELAY_TOKEN (openssl rand -hex 32)}
    ports:
      - "127.0.0.1:${RELAY_HTTP_PORT:-8080}:8080"
