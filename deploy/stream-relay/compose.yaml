# Direct HTTPS deployment. For ingress TLS termination use compose.ingress.yaml.
name: justai-stream-relay
services:
  relay:
    # Official image; pin RELAY_IMAGE to a version (e.g. ...:relay-1.2.3) in production.
    # To build locally instead, see "Build the image yourself" in the README.
    image: ${RELAY_IMAGE:-ghcr.io/justlabv1/justai:relay-latest}
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    ulimits:
      nofile: {soft: 256, hard: 256}
    ports:
      - "${RELAY_BIND_ADDRESS:?Set RELAY_BIND_ADDRESS to the intended host interface}:8443:8443"
    volumes:
      - ./sources.json:/etc/stream-relay/sources.json:ro
      - ./tls.crt:/etc/stream-relay/tls.crt:ro
    secrets:
      - relay_token
      - tls_key
secrets:
  relay_token:
    file: ./secrets/relay_token
  tls_key:
    file: ./secrets/tls_key
